[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moogle"
version = "1.0.0"
description = "BG-Wiki MediaWiki export ingestion and RAG preparation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "mwparserfromhell>=0.6.5",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "zstandard>=0.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
moogle = "moogle_ingest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
